[project]
name = "sustainable-packaging-intelligence"
version = "2.0.0"
description = "Financial and operational reporting for sustainable packaging businesses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "openpyxl>=3.1,<4",
    "openai>=1.80,<3",
    "pytest>=8,<10",
    "python-pptx>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.main:app"
